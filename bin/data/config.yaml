# if doing a non-real-time render
nrt-render: false
draw-bounds: false
csv-folder: /Applications/of_v0.11.2_osx_release/apps/myApps/modular_video_02/supercollider/data-renders/221121_173756
max-frames: 99999
use-sc-onsets: true
initial-active-modules: [0,1,3,4] # only 4!
initial-onset: false
verbose: false

audio-sample-rate: 44100
target-framerate: 30

blend-mode-probs: [1,1,0,0,0,0] # add, alpha, screen, disable, multiply, subtract
feedback-prob: 0.25
feedback-max: 254
flow-field-resolution: 20 # this was originally 20
onset-switch-prob: 0.9

show-flow-prob: 0.99 # 0.16

modules:
  waveform: # module index: 0
    prob: 2 # int because it's how many times to put it in the pool of options
    lissajous-line-width: 1.0 # must be a float
    waveform-line-width: 1.0 # must be a float
    ikeda-prob: 0.2
    max-waveforms: 2
  mesh: # module index: 1
    prob: 2 # int because it's how many times to put it in the pool of options
    line-width: 1.0 # must be a float
    point-size: 3.0 # must be a float
    flow-field-influence: 0.16
    n-points: 500
    speed: 0.012
    min-speed: 0.0005
    jitter-mul: 0.003
    dist-thresh-mul: 0.015 # 0.15
  mag-lines: # module index: 2
    prob: 2 # int because it's how many times to put it in the pool of options
  turtle: # module index: 3
    divisors: [ 3, 4, 6 ]
    prob: 1 # int because it's how many times to put it in the pool of options
    max-frames: 20

videos:
  - # module index: 4
    name: "leaf"
    prob: 2
    sub-videos: ["original","canny"]
    show-hap-prob: 0.4
    use-ff-prob: 0.18
    boxes-prob: 0.2
    speed-min: 0.9
    speed-max: 10.0 # must be a float
    speed-pow: 4.0 # must be a float
  - # module index: 5
    name: "tree"
    prob: 2
    sub-videos: ["original","max-area"]
    show-hap-prob: 0.4
    use-ff-prob: 0.18
    boxes-prob: 0.2
    speed-min: 0.9
    speed-max: 10.0 # must be a float
    speed-pow: 4.0 # must be a float
  - # module index: 6
    name: "westrock"
    prob: 2
    sub-videos: ["tiled"]
    show-hap-prob: 0.4
    use-ff-prob: 0.18
    boxes-prob: 0.2
    speed-min: 0.9
    speed-max: 10.0 # must be a float
    speed-pow: 4.0 # must be a float

post-glitch:
  change-prob:       0.75
  convergence-prob:  0.06
  glow-prob:         0.2
  shaker-prob:       0.01
  cutslider-prob:    0.01
  twist-prob:        0.008
  outline-prob:      0.03
  noise-prob:        0.05
  slitscan-prob:     0.01
  swell-prob:        0.01
  invert-prob:       0.06
  highcontrast-prob: 0.016
  blueraise-prob:    0.008
  redraise-prob:     0.008
  greenraise-prob:   0.008
  redinvert-prob:    0.008
  blueinvert-prob:   0.008
  greeninvert-prob:  0.008

