# if doing a non-real-time render
nrt-render: false
csv-folder: None
max-frames: 1800 # 99999 = 55.55 minutes

target-framerate: 30
blend-mode-probs: [1,1,0,0,0,0] # add, alpha, screen, disable, multiply, subtract
feedback-prob: 0.25
feedback-max: 254
flow-field-resolution: 12 # this was originally 20

modules:
  waveform:
    prob: 5 # int because it's how many times to put it in the pool of options
    lissajous-line-width: 1.0 # must be a float
    waveform-line-width: 1.0 # must be a float
    ikeda-prob: 0.2
    max-waveforms: 2
  mesh:
    prob: 50 # int because it's how many times to put it in the pool of options
    line-width: 1.0 # must be a float
    point-size: 2.0 # must be a float
    flow-field-influence: 0.2
    n-points: 500
    speed: 0.04
    min-speed: 0.0005
  mag-lines:
    prob: 4 # int because it's how many times to put it in the pool of options
  turtle:
    divisors: [ 3, 4, 6 ]
    prob: 1 # int because it's how many times to put it in the pool of options
    max-frames: 20

videos:
  - 
    name: "eye4720"
    prob: 2 # int because it's how many times to put it in the pool of options
  -
    name: "eye4948"
    prob: 2
  -
    name: "canola-radial-blur"
    prob: 1
  - 
    name: "oil-water-1283-denoised-HQ1080"
    prob: 1
  -
    name: "oil-water-1286-HQ720"
    prob: 1

post-glitch:
  change-prob: 0.75
  convergence-prob:  0.05
  glow-prob:         0.2
  shaker-prob:       0.01
  cutslider-prob:    0.01
  twist-prob:        0.01
  outline-prob:      0.04
  noise-prob:        0.05
  slitscan-prob:     0.01
  swell-prob:        0.01
  invert-prob:       0.04
  highcontrast-prob: 0.01
  blueraise-prob:    0.005
  redraise-prob:     0.005
  greenraise-prob:   0.005
  redinvert-prob:    0.005
  blueinvert-prob:   0.005
  greeninvert-prob:  0.005
  rgb2422-prob: 0.0
  phong-prob: 0.01