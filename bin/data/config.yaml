# if doing a non-real-time render
nrt-render: false
csv-folder: /Applications/of_v0.11.2_osx_release/apps/myApps/modular_video_02/supercollider/data-renders/221121_173756
max-frames: 99999
use-sc-onsets: true
initial-active-modules: [-1,-1,-1,-1] # only 4!
initial-onset: true

audio-sample-rate: 44100
target-framerate: 30

blend-mode-probs: [1,1,0,0,0,0] # add, alpha, screen, disable, multiply, subtract
feedback-prob: 0.25
feedback-max: 254
flow-field-resolution: 12 # this was originally 20
onset-switch-prob: 0.5

modules:
  waveform: # module index: 0
    prob: 3 # int because it's how many times to put it in the pool of options
    lissajous-line-width: 1.0 # must be a float
    waveform-line-width: 1.0 # must be a float
    ikeda-prob: 0.2
    max-waveforms: 2
  mesh: # module index: 1
    prob: 3 # int because it's how many times to put it in the pool of options
    line-width: 1.0 # must be a float
    point-size: 2.0 # must be a float
    flow-field-influence: 0.16
    n-points: 500
    speed: 0.012
    min-speed: 0.0005
    jitter-mul: 0.003
    dist-thresh-mul: 0.015 # 0.15
  mag-lines: # module index: 2
    prob: 3 # int because it's how many times to put it in the pool of options
  turtle: # module index: 3
    divisors: [ 3, 4, 6 ]
    prob: 1 # int because it's how many times to put it in the pool of options
    max-frames: 20

videos:
  - # module index: 4
    name: "canola-radial-blur"
    prob: 1
    show-hap-prob: 0.2
    show-rects-prob: 0.4
    use-ff-prob: 0.18
  - # module index: 5
    name: "oil-water-1283-denoised-HQ1080" # mostly blue
    prob: 1
    show-hap-prob: 0.2
    show-rects-prob: 0.4
    use-ff-prob: 0.18
  - # module index: 6
    name: "oil-water-1286-HQ720" # crazy colors
    prob: 1
    show-hap-prob: 1.0
    show-rects-prob: 0.0
    use-ff-prob: 0.18
  - # module index: 7
    name: "eye4720"
    prob: 2 # int because it's how many times to put it in the pool of options
    show-hap-prob: 0.2
    show-rects-prob: 0.4
    use-ff-prob: 0.18
  - # module index: 8
    name: "eye4948"
    prob: 2
    show-hap-prob: 0.2
    show-rects-prob: 0.4
    use-ff-prob: 0.18
  - # module index: 9
    name: "slow-water"
    prob: 1
    show-hap-prob: 0.2
    show-rects-prob: 0.4
    use-ff-prob: 0.18

post-glitch:
  change-prob:       0.75
  convergence-prob:  0.06
  glow-prob:         0.2
  shaker-prob:       0.01
  cutslider-prob:    0.01
  twist-prob:        0.008
  outline-prob:      0.03
  noise-prob:        0.05
  slitscan-prob:     0.01
  swell-prob:        0.01
  invert-prob:       0.06
  highcontrast-prob: 0.016
  blueraise-prob:    0.008
  redraise-prob:     0.008
  greenraise-prob:   0.008
  redinvert-prob:    0.008
  blueinvert-prob:   0.008
  greeninvert-prob:  0.008